# =============================================================================
# scripts/nginx_v3.patch.conf —— v3 需要的 nginx 改动（片段，不是完整配置）
#
# ★ 这个文件**不能** include，它是给人照着改的。要改的是这两个文件：
#     /etc/nginx/nginx.conf                    —— §2 的 log_format（只能放 http 块）
#     /etc/nginx/conf.d/flaskapp_http.conf     —— §1 §3 §4 §5（server 块里）
#
# 改之前：
#     sudo cp -a /etc/nginx/conf.d/flaskapp_http.conf{,.bak-v3-$(date +%Y%m%d%H%M%S)}
#     sudo cp -a /etc/nginx/nginx.conf{,.bak-v3-$(date +%Y%m%d%H%M%S)}
# 改之后：
#     sudo nginx -t && sudo systemctl reload nginx     # reload 不断连接，不要用 restart
# 回滚：
#     把 .bak-v3-* 拷回去，再 nginx -t && systemctl reload nginx
#
# ⚠️ 这个文件里所有 server 块都被 certbot 管着（`# managed by Certbot` 那些行）。
#    certbot 续证时会重写 listen / ssl_* 行，**可能把 §1 加的 http2 洗掉**。
#    续证后请用 §6 的 curl 命令复验一次。
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# §0 · 实测现状（2026-09-23，nginx/1.24.0 (Ubuntu)）—— 先看这段，它推翻了一条结论
# ─────────────────────────────────────────────────────────────────────────────
#
# ★ 更正 09 文档 D11-3：**HTTP/2 现在其实是开着的。**
#
#   之前的判断是「所有 server 块都是 listen 443 ssl，没有 http2」。这话只对了一半：
#   9 处 listen 443 里确实有 7 处没写 http2，但 flaskapp_http.conf:66（fahui 那块）
#   和 yukang_utbabuddha_http.conf:17 写了。
#
#   而 http2 是**按监听套接字**生效的，不是按 server 块：同一个 0.0.0.0:443 上
#   只要有**任意一个** server 块写了 http2，整个套接字就开了 h2；h2 是在 TLS 握手的
#   ALPN 阶段协商的，那时候 nginx 还没挑 server 块，所以这个域名上的**所有** vhost
#   都跟着开。实测（--resolve 打到 127.0.0.1，绕过 CDN）：
#
#       v2.utbabuddha.com   -> HTTP/2     ALPN protocol: h2
#       fahui.utbabuddha.com-> HTTP/2
#       aci.utbabuddha.com  -> HTTP/2
#
#   → 所以「SSE 的拦路石」这一条**不成立**，不必为了它推迟 SSE 改造。
#
#   → 但 §1 还是要做，理由变了：现在全站的 h2 靠的是 fahui 那一块里偶然写着的一个词。
#     谁把那块删了、或者 certbot 某次续证把它重写成 `listen 443 ssl;`，
#     全站会**静默**退回 HTTP/1.1 —— nginx -t 通过、reload 成功、没有任何告警，
#     只是所有页面开始莫名其妙卡住（每域名 6 连接被 SSE 占掉一个）。
#     这种「无声失效」比「本来就没开」更危险。把 http2 写全，就不再依赖运气。


# ─────────────────────────────────────────────────────────────────────────────
# §1 · 开 HTTP/2 —— 9 处 listen 443 全部补上 http2
# ─────────────────────────────────────────────────────────────────────────────
#
# nginx 1.24 用的是**旧语法**：http2 写在 listen 行上。
#   listen 443 ssl http2;        ← 1.24 的写法（本机）
#   listen 443 ssl; http2 on;    ← 1.25.1+ 才有的独立指令，写在 1.24 上会 nginx -t 报错
#
# 为什么非开不可（12 文档 §5 坑 1）：HTTP/1.1 下浏览器对同一域名最多 6 条并发连接，
# 一条 SSE 会**永久**占住一条。开 3 个标签页 = 3 条 SSE，剩下的 API 请求开始排队，
# 表现是「页面莫名其妙卡住」，而且 DevTools 里看不出原因（请求停在 Queued/Stalled）。
# HTTP/2 一条 TCP 连接上多路复用，这个上限就不存在了。
#
# 要改的行（sudo sed -i 只改没写 http2 的那些，写了的别重复加）：
#   /etc/nginx/conf.d/flaskapp_http.conf         第 16、40、184、225、244、263 行
#   /etc/nginx/conf.d/ocr_project.conf           第 17 行
#   （第 66 行、yukang_utbabuddha_http.conf:17 已经有了，跳过）
#
# 逐行改成：

    listen 443 ssl http2; # managed by Certbot

# 一条命令批量改（幂等：已经有 http2 的不会被改成两个）：
#   sudo sed -i -E 's/^(\s*listen\s+443\s+ssl)(\s*;)/\1 http2\2/' \
#       /etc/nginx/conf.d/flaskapp_http.conf /etc/nginx/conf.d/ocr_project.conf
#
# ⚠️ 只改 443。80 端口那些 server 块（全是 certbot 的 301 跳转）不要动 ——
#    明文 h2c 浏览器根本不用，加上去只会让配置更难读。


# ─────────────────────────────────────────────────────────────────────────────
# §2 · access log 加 $request_time —— 这段改 /etc/nginx/nginx.conf，不是 conf.d
# ─────────────────────────────────────────────────────────────────────────────
#
# 为什么改这里：log_format 只能出现在 **http 上下文**里。写进 conf.d/*.conf 的
# server 块会直接 nginx -t 报错 "log_format directive is not allowed here"。
# conf.d/*.conf 本身是在 http 块里被 include 的，所以放在文件最顶层（server 外）
# 也行；但放 nginx.conf 更好找，而且一次定义全局可用。
#
# 为什么要做（09 文档 D11-2）：现在的日志**没有记耗时**，
# 「最长的请求要多久」这个问题在 access.log 里查不出来 —— 而这个数字是定
# gunicorn/uvicorn `--timeout` 的唯一依据。先埋点，积累一两周，再拿 p99 定值。
#
# 两个时间都要记，因为它们回答的是不同的问题：
#   $request_time           nginx 收到第一个字节 → 写完最后一个字节（**含客户端慢读**）
#   $upstream_response_time 后端处理耗时
# 两者差得大 = 客户端网络慢（法会现场 4G 拥堵），**不是**后端慢。
# 只记一个的话，这两种情况长得一模一样，会把人引到错误的方向上去优化。

# 放在 /etc/nginx/nginx.conf 的 http { } 里，Logging Settings 那一段：

    log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';

    # 原来这一行是 `access_log /var/log/nginx/access.log;`，末尾补上格式名
    access_log /var/log/nginx/access.log timed;

# ⚠️ 统计 p99 的时候要**排除 /realtime**：一条 SSE 挂机半小时，rt 就是 1800，
#    混进去会把分位数彻底污染。§3 里给 /realtime 单独开了一个日志文件，
#    就是为了让主日志干净，统计直接用 access.log 即可。
# ⚠️ 换了格式之后，现有按旧列数解析 access.log 的脚本（如果有）要跟着改。


# ─────────────────────────────────────────────────────────────────────────────
# §3 §4 §5 · xinya 的 server 块
#        （flaskapp_http.conf 里 `server_name v2.utbabuddha.com utbabuddha.com utba.my;`
#          那一块，把下面几段加进去；位置放在现有 `location /` **之前**）
# ─────────────────────────────────────────────────────────────────────────────

    # ── §5 之一 · /UTBA_DEMO 补斜杠 ────────────────────────────────────────
    # 没有这条的话，用户手打 https://v2.utbabuddha.com/UTBA_DEMO（不带斜杠）会 404：
    # 它匹配不上下面的前缀 location `/UTBA_DEMO/`。
    # `=` 是精确匹配，优先级最高，写在哪儿都一样，放最前面只是为了好读。
    location = /UTBA_DEMO { return 301 /UTBA_DEMO/; }

    # ── §4 · 路径前缀转发（11 文档 §3 方案 A）─────────────────────────────
    #
    # `^~` 这个修饰符是**关键**，不是可有可无的装饰：
    #   nginx 的 location 优先级是   =  >  ^~  >  正则(按书写顺序)  >  普通前缀
    #   不写 `^~` 的话，下面 §5 那条不区分大小写的 301 正则会**抢在**这条前面匹配上
    #   /UTBA_DEMO/xxx（因为正则优先于普通前缀），于是 301 跳到它自己 →
    #   浏览器报 ERR_TOO_MANY_REDIRECTS，整个项目打不开。
    #   `^~` 的语义是「这个前缀匹配上了就**不再检查正则**」，正好堵住这个死循环。
    #
    # proxy_pass 末尾那个 `/` 也是关键：有它 nginx 才会把 /UTBA_DEMO 剥掉，
    # 后端收到的是 /api/xxx，应用内部 574 条路由一条都不用改。
    # 而且这种剥法是 nginx 原生做的，**不会破坏 URL 编码** —— 用正则捕获 + $1 拼
    # proxy_pass 也能剥，但 $1 来自已经解码过的 $uri，路径里有中文/%2F 时会出错。
    # 这个项目的附件名大量是中文，这一点不能省。
    location ^~ /UTBA_DEMO/ {
        proxy_pass http://127.0.0.1:5006/;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ★ 应用靠这个头知道自己「对外挂在哪个路径下」，用来生成二维码/分享链接。
        #   Flask 阶段由 core/prefix.py 写进 SCRIPT_NAME，FastAPI 阶段对应 root_path。
        #   值必须和上面 location 的前缀一字不差，且**不带**结尾斜杠。
        proxy_set_header X-Forwarded-Prefix /UTBA_DEMO;
        # 现有 `location /` 里是 Connection "upgrade"（Socket.IO 时代的遗留）。
        # 这里不要照抄：SSE 不是 WebSocket，不需要协议升级；而且 HTTP/2 下
        # $http_upgrade 永远是空的，发一个孤零零的 Connection: upgrade 没有意义。
        proxy_set_header Connection        "";
        # 和现有 location / 保持一致，不然大文件上传会在这条新路径上 413。
        client_max_body_size 50000M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # ── §3 · SSE 专用（12 文档 §5 坑 2、坑 3）───────────────────────────
        #
        # 嵌在外层 location 里面，因为外层用了 `^~`，顶层的正则 location 不会再被检查；
        # 嵌套进来才能匹配得上。nginx 支持 location 嵌套，内层照常按优先级匹配。
        #
        # 正则里必须自己把 /UTBA_DEMO 捕获掉：正则 location 的 proxy_pass **不允许**
        # 带静态 URI（nginx 会报 "proxy_pass cannot have URI part in location given by
        # regular expression"），所以 §4 那种末尾加 / 的剥法在这里用不了，只能用 $1。
        #
        # ★ $is_args$args 不能漏：proxy_pass 里一旦出现变量，nginx 就**不再自动
        #   附加查询串**。SSE 的房间是靠 ?room=a&room=b 传的，漏了这一段，
        #   所有客户端都会订阅到空房间 —— 连接建得起来、心跳也正常、就是收不到消息，
        #   是最难查的那一类故障。
        #
        # ⚠️ 用 $1 的代价（实测过）：$1 取自**已经解码**的 $uri，所以路径里的
        #   %E4%B8%AD 会变成裸的 UTF-8 字节发给后端。SSE 的路径是 /{app}/realtime，
        #   全 ASCII，不受影响 —— 但这条约束要守住：**realtime 的路径段里不要出现
        #   需要百分号编码的字符**，房间名之类一律走查询串（?room=...），
        #   查询串是原样透传的，不会被解码。
        location ~ ^/UTBA_DEMO(/.*/realtime)$ {
            proxy_pass http://127.0.0.1:5006$1$is_args$args;

            proxy_http_version 1.1;              # 1.0 不支持分块传输，SSE 直接废掉
            proxy_set_header Connection        "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /UTBA_DEMO;

            # ★ 默认 proxy_buffering on 会把 SSE 消息**攒在 nginx 里**，
            #   表现为「延迟几十秒」或者「一次性涌出来一堆」。抢答功能会直接不可用。
            proxy_buffering off;
            proxy_cache off;
            # gzip 同理：压缩要凑够一块才输出，等于又加了一层缓冲。
            gzip off;

            # ★ 默认 proxy_read_timeout 是 60s。SSE 静默超过 60 秒就被 nginx 掐断，
            #   前端 EventSource 自动重连 → 每分钟一次重连风暴 → 每次重连都要拉
            #   一次 snapshot → 数据库被打爆。这个默认值必须改。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 长连接的日志单独放，别污染 access.log 的耗时分位数（见 §2 末尾）。
            access_log /var/log/nginx/xinya_realtime.log timed;
        }
    }

    # ── §5 之二 · /utba_demo → /UTBA_DEMO 的不区分大小写 301（09 文档 D10）──
    #
    # 规范写法只有 /UTBA_DEMO 一个，其余大小写一律 301 过去，
    # 避免同一个页面存在两个 URL（会话 Cookie 的 path、分享链接、统计全都会分叉）。
    #
    # `~*` = 不区分大小写的正则。它能匹配 /utba_demo、/Utba_Demo、也包括 /UTBA_DEMO
    # 本身 —— 所以**必须**靠上面那条 `^~` 把规范写法先截走，否则自己跳自己死循环。
    # 这一条要写在 §4 之后：正则 location 按书写顺序先到先得，顺序反了不会报错，
    # 但 nginx -t 也不会提醒你，只会在浏览器上炸。
    #
    # $1 为空时（输入就是 /utba_demo，没有后面的路径）会跳到 /UTBA_DEMO，
    # 再由最上面那条 `= /UTBA_DEMO` 跳到 /UTBA_DEMO/。两跳，可以接受。
    location ~* ^/utba_demo(/.*)?$ {
        return 301 /UTBA_DEMO$1;
    }


# ─────────────────────────────────────────────────────────────────────────────
# §6 · 改完怎么验（每一条都要真的跑一遍）
# ─────────────────────────────────────────────────────────────────────────────
#
# 1) 语法与热加载
#      sudo nginx -t && sudo systemctl reload nginx
#
# 2) HTTP/2 真的开了（--resolve 绕过 CDN，直接打本机，否则测的是 CDN 不是 nginx）
#      curl -sk --http2 -o /dev/null -w '%{http_version}\n' \
#           --resolve v2.utbabuddha.com:443:127.0.0.1 https://v2.utbabuddha.com/
#      期望输出：2
#      浏览器侧：DevTools → Network → 右键表头勾上 Protocol 列 → 应该是 h2
#      APK 的 WebView 也要单独确认一次（12 文档 §5 的验收项）
#
# 3) 前缀转发与剥前缀
#      curl -skI --resolve v2.utbabuddha.com:443:127.0.0.1 \
#           https://v2.utbabuddha.com/UTBA_DEMO/
#      后端日志里看到的路径应该是 /（不带 /UTBA_DEMO），
#      且请求头里有 X-Forwarded-Prefix: /UTBA_DEMO
#
# 4) 大小写 301（三种写法都要试，注意 -I 不要跟 -L，要看到 301 本身）
#      curl -skI .../utba_demo/     → 301 Location: /UTBA_DEMO/
#      curl -skI .../Utba_Demo/     → 301 Location: /UTBA_DEMO/
#      curl -skI .../UTBA_DEMO/     → 200（★ 如果这里也是 301，说明 §4 的 ^~ 漏了，
#                                       就是那个死循环）
#      curl -skI .../UTBA_DEMO      → 301 Location: /UTBA_DEMO/
#
# 5) SSE 不被缓冲、不被掐断
#      curl -skN --resolve v2.utbabuddha.com:443:127.0.0.1 \
#           'https://v2.utbabuddha.com/UTBA_DEMO/xinya/realtime?room=test'
#      · 消息要**立刻**一条条出来，不是攒一堆一起出（验 proxy_buffering off）
#      · 响应头里要有 content-type: text/event-stream，且**没有** content-length
#      · 挂机 30 分钟不断（验 proxy_read_timeout；60 秒就断 = 这条没生效）
#      · 后端收到的 query 里要有 room=test（验 $is_args$args 没漏）
#
# 6) 埋点生效
#      tail -n 3 /var/log/nginx/access.log     # 行尾应有 rt=0.123 urt=0.120
#
#
# ── 上线之后还要跟进的两件事 ────────────────────────────────────────────────
#
# · SSE 全面替换 Socket.IO 之后，删掉这个 server 块里的 `location /socket.io/`
#   和 xinya_socket.service（08 文档 §1）。在那之前两者共存，不冲突。
#
# · certbot 续证会重写 listen 行。续证后重跑一次 §6-2，确认 http2 还在。
#   保险做法是在 certbot 的 deploy hook 里挂上 §1 那条 sed + nginx -t + reload。
