# dev 域名 yukang.utbabuddha.com 的 nginx 配置（v3 路径基座 + SSE）
#
# 应用：sudo cp scripts/nginx_yukang_dev.conf /etc/nginx/conf.d/yukang_utbabuddha_http.conf
#       sudo /usr/local/sbin/xinya-admin nginx-reload
# 回滚：sudo cp /etc/nginx/conf.d/yukang_utbabuddha_http.conf.bak /etc/nginx/conf.d/yukang_utbabuddha_http.conf
#
# ★ location 的先后顺序是有意义的，别调换：
#   nginx 先按「前缀 location 最长匹配」挑出候选，再**按书写顺序**逐个试正则
#   location，第一个匹配的胜出、不再往下看。下面三个正则的顺序就是靠这个规则：
#     ① /realtime  —— 必须最先，否则会被 ② 吃掉，SSE 的关缓冲配置就没了
#     ② /UTBA_DEMO —— 规范写法（大小写敏感）
#     ③ /utba_demo —— 其余大小写变体才 301。**必须排在 ② 之后**：
#        它是 ~*（不敏感），会连 /UTBA_DEMO 一起匹配，排前面就是 301 死循环。
#        （上一版正是栽在这里，全部前缀路径无限 301。）

server {
    server_name yukang.utbabuddha.com;

    # ── ① SSE 实时端点：{BASE}/{app}/realtime ─────────────────────────
    # 一条 location 同时管带前缀和不带前缀两种：rewrite 匹配不上就原样放行。
    # proxy_buffering off 是关键：不关的话 nginx 会把 SSE 消息攒在缓冲区，
    # 表现成「延迟几十秒」或「一次涌出一堆」，极难排查。
    location ~ /realtime$ {
        rewrite ^/UTBA_DEMO(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5102;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;       # 默认 60s 会把长连接掐断
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /UTBA_DEMO;
    }

    # ── ② 项目路径前缀（规范写法，大小写敏感）─────────────────────────
    # 用正则 + rewrite 而不是 `location /UTBA_DEMO/ { proxy_pass .../; }`：
    # 前缀 location 的优先级低于正则 location，会被 ③ 抢走。
    # rewrite ... break 把 /UTBA_DEMO 这一段剥掉，应用内部路由表不用改；
    # 应用靠 X-Forwarded-Prefix 知道自己对外挂在哪一段（拼分享链接、重定向）。
    location ~ ^/UTBA_DEMO(/.*)?$ {
        rewrite ^/UTBA_DEMO$ /UTBA_DEMO/ permanent;   # 无尾斜杠先规范化
        rewrite ^/UTBA_DEMO/(.*)$ /$1 break;          # 空捕获 → /，正好是首页
        proxy_pass http://127.0.0.1:5102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /UTBA_DEMO;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 50000M;
    }

    # ── ③ 其余大小写变体 → 301 到规范写法 ────────────────────────────
    # URL 路径区分大小写，/utba_demo 手打进来会 404。规范写法只留一个。
    # $is_args$args 不能省：return 不像 rewrite 会自动带上查询串，
    # 省了的话 /utba_demo/mirror?token=abc 会丢掉 token。
    location ~* ^/utba_demo(/.*)?$ {
        return 301 /UTBA_DEMO$1$is_args$args;
    }

    # ── 根路径转发（原有，未改动）─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yukang.utbabuddha.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yukang.utbabuddha.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = yukang.utbabuddha.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name yukang.utbabuddha.com;
    return 404; # managed by Certbot


}
