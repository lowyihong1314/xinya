<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    {% set ev = form.events[-1] if form.events else None %}
    <title>{{ (ev.event_name if ev else None) or form.title or "报名表格" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- favicon / og:image：有活动海报用海报，否则退回站点默认 icon -->
    {% if ev and ev.event_image %}
    <link rel="icon" href="/api/form/event_poster/{{ form.id }}/cache" />
    <meta
      property="og:image"
      content="/api/form/event_poster/{{ form.id }}/cache"
    />
    {% else %}
    <link rel="icon" href="/favicon.ico" />
    {% endif %}
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f7f7f7;
      }
    </style>
  </head>

  <body>
    <!-- React 接管渲染 -->
    <div id="root" data-form-id="{{ form.id }}" data-form-title="{{ form.title|e }}"></div>
    <script>
      window.form_data = {{ form | tojson }};
    </script>
    <script src="/static/vite/form-public.js" type="module"></script>
  </body>
</html>
