<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>青少年 & 青年佛学班报名表</title><style>:root{--bg:#f6f7fb;--panel:#fff;--line:#d9e2ec;--text:#172b4d;--muted:#52606d;--accent:#3461ff;--accent-2:#6e56cf;--ok:#027a48}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"PingFang SC","Microsoft Yahei",sans-serif;background:linear-gradient(180deg,#eef2ff,var(--bg));color:var(--text)}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 48px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.hero{padding:28px;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{margin:8px 0 12px;font-size:34px}p{margin:0;line-height:1.75;color:var(--muted)}form.panel{padding:24px;display:grid;gap:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:grid;gap:8px;font-size:14px;font-weight:600}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14px;background:#fff}textarea{min-height:100px;resize:vertical}.sub{font-size:16px;font-weight:700;margin-top:4px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{border:none;border-radius:999px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer}.btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}.btn-secondary{background:#eef2ff;color:var(--text)}.notice{display:none;padding:14px 16px;border-radius:14px;background:#ecfdf3;color:var(--ok);border:1px solid #abefc6}.checkbox{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--muted)}.checkbox input{width:18px;height:18px;margin-top:1px}.foot{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">UTBA / 公开报名</div><h1>青少年 & 青年佛学班报名表</h1><p>欢迎填写报名资料。提交后，资料会送到佛学班报名后台，方便后续联系与安排。若你是未成年人，也可以填写监护人资料，方便后续联络。</p></section><div id="notice" class="notice"></div><form id="youth-form" class="panel"><div class="grid"><label>中文姓名 *<input name="chinese_name" required /></label><label>英文姓名<input name="english_name" /></label><label>性别<select name="gender"><option value="">请选择</option><option>男</option><option>女</option><option>其他</option></select></label><label>出生日期<input type="date" name="birth_date" /></label><label>年龄<input name="age" /></label><label>联络电话 *<input name="phone" required /></label><label>WhatsApp<input name="whatsapp" /></label><label>Email<input type="email" name="email" /></label><label>学校 / 学院<input name="school" /></label><label>年级 / 学历<input name="education_level" /></label><label>职业<input name="occupation" /></label><label>出席方式<select name="attendance_preference"><option value="">请选择</option><option>实体</option><option>线上</option><option>都可以</option></select></label></div><div class="sub">监护人与紧急联络</div><div class="grid"><label>监护人姓名<input name="guardian_name" /></label><label>监护人电话<input name="guardian_phone" /></label><label>紧急联络人<input name="emergency_contact_name" /></label><label>紧急联络电话<input name="emergency_contact_phone" /></label></div><label>居住地址<textarea name="address"></textarea></label><label>学佛经历 / 接触佛法经验<textarea name="buddhist_experience"></textarea></label><label>报名原因 / 学习目标<textarea name="learning_goals"></textarea></label><label>可参与时段<textarea name="available_time"></textarea></label><label>健康状况 / 饮食 / 药物备注<textarea name="medical_notes"></textarea></label><label>从哪里得知课程<input name="referral_source" /></label><label>其他备注<textarea name="remarks"></textarea></label><label class="checkbox"><input type="checkbox" name="agree_contact" checked /><span>我同意道场使用以上联络方式联系我，通知课程与活动资讯。</span></label><div class="row"><button class="btn btn-primary" type="submit">提交报名</button><button class="btn btn-secondary" type="reset">重置</button></div></form><div class="foot">提交后若需补充资料，法务/筹委会可再联系你。</div></div><script>const form=document.getElementById("youth-form");const notice=document.getElementById("notice");function showNotice(message,isError=false){notice.style.display="block";notice.textContent=message;notice.style.background=isError?"#fff1f2":"#ecfdf3";notice.style.color=isError?"#b42318":"#027a48";notice.style.borderColor=isError?"#fecdd3":"#abefc6";window.scrollTo({top:0,behavior:"smooth"})}form.addEventListener("submit",async(event)=>{event.preventDefault();const formData=new FormData(form);const payload=Object.fromEntries(formData.entries());payload.agree_contact=formData.get("agree_contact")==="on";try{const res=await fetch("/api/form/youth-class-registration/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok||data.status!=="success")throw new Error(data.message||"提交失败，请稍后再试");form.reset();form.querySelector("input[name=agree_contact]").checked=true;showNotice("报名已提交成功，我们已收到你的资料。")}catch(error){showNotice(error instanceof Error?error.message:"提交失败，请稍后再试",true)}});</script></body></html>
