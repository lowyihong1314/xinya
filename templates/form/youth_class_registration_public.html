<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>青少年 & 青年佛学班报名表</title>
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--line:#d9e2ec;--text:#172b4d;--muted:#52606d;--accent:#3461ff;--accent-2:#6e56cf;--ok:#027a48;--bad:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"PingFang SC","Microsoft Yahei",sans-serif;background:linear-gradient(180deg,#eef2ff,var(--bg));color:var(--text)}
    .wrap{max-width:920px;margin:0 auto;padding:28px 18px 48px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 40px rgba(15,23,42,.08)}
    .hero{padding:28px;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{margin:8px 0 12px;font-size:34px}p{margin:0;line-height:1.75;color:var(--muted)}
    form.panel{padding:24px;display:grid;gap:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:grid;gap:8px;font-size:14px;font-weight:600}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14px;background:#fff}textarea{min-height:100px;resize:vertical}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{border:none;border-radius:999px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer}.btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}.btn-secondary{background:#eef2ff;color:var(--text)}
    .notice,.hint{padding:14px 16px;border-radius:14px;border:1px solid}.notice{display:none}.hint{display:none}.ok{background:#ecfdf3;color:var(--ok);border-color:#abefc6}.bad{background:#fff1f2;color:var(--bad);border-color:#fecdd3}.soft{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
    .foot{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">UTBA / 公开报名</div>
      <h1>青少年 & 青年佛学班报名表</h1>
      <p>报名资格：青少年 13-17 岁，青年 18-40 岁。系统会根据 NRIC 自动判断年龄与组别，不符合资格者不能提交。</p>
    </section>
    <div id="notice" class="notice"></div>
    <div id="hint" class="hint soft"></div>
    <form id="youth-form" class="panel">
      <div class="grid">
        <label>中文名 *<input name="chinese_name" required /></label>
        <label>英文名 *<input name="english_name" required /></label>
        <label>登录用户名 (username)<input name="username" placeholder="留空就自动用英文名，例如 Hazell Tan → hazelltan" /></label>
        <label>NRIC *<input name="nric" required placeholder="如：010203101234" /></label>
        <label>性别 *
          <select name="gender" required>
            <option value="">请选择</option><option>男</option><option>女</option>
          </select>
        </label>
        <label>手机号码 *<input name="phone" required /></label>
        <label>年龄（自动）<input name="age_display" readonly /></label>
        <label>组别（自动）<input name="category_display" readonly /></label>
      </div>
      <label>住家地址 *<textarea name="address" required></textarea></label>
      <div class="grid">
        <label>紧急联络人名字 *<input name="emergency_contact_name" required /></label>
        <label>紧急联络号码 *<input name="emergency_contact_phone" required /></label>
        <label>关系 *<input name="emergency_contact_relation" required /></label>
      </div>
      <div class="row">
        <button class="btn btn-primary" type="submit">提交报名</button>
        <button class="btn btn-secondary" type="reset">重置</button>
      </div>
    </form>
    <div class="foot">提交后若需补充资料，后续会再联系你。</div>
  </div>
  <script>
    const form = document.getElementById("youth-form");
    const notice = document.getElementById("notice");
    const hint = document.getElementById("hint");
    const nricInput = form.querySelector('input[name="nric"]');
    const ageDisplay = form.querySelector('input[name="age_display"]');
    const categoryDisplay = form.querySelector('input[name="category_display"]');
    let eligibility = { ok: false, age: null, category: "" };

    function showBox(el, message, cls) {
      el.className = el.id === "notice" ? `notice ${cls}` : `hint ${cls}`;
      el.style.display = "block";
      el.textContent = message;
    }
    function hideBox(el) { el.style.display = "none"; }

    async function checkNric() {
      const nric = (nricInput.value || "").trim();
      ageDisplay.value = "";
      categoryDisplay.value = "";
      eligibility = { ok: false, age: null, category: "" };
      if (!nric) { hideBox(hint); return; }
      try {
        const res = await fetch(`/api/form/youth-class-registration/nric-check?nric=${encodeURIComponent(nric)}`);
        const data = await res.json();
        if (!res.ok || data.status !== "success") throw new Error(data.message || "NRIC 检查失败");
        ageDisplay.value = data.age;
        categoryDisplay.value = data.category;
        eligibility = { ok: !!data.eligible, age: data.age, category: data.category };
        if (data.eligible) showBox(hint, `资格符合：${data.category}（${data.age} 岁）`, "soft");
        else showBox(hint, `不符合资格：${data.age} 岁，仅限 13-40 岁报名`, "bad");
      } catch (error) {
        showBox(hint, error instanceof Error ? error.message : "NRIC 检查失败", "bad");
      }
    }

    nricInput.addEventListener("blur", checkNric);
    nricInput.addEventListener("change", checkNric);

    form.addEventListener("reset", () => {
      setTimeout(() => {
        ageDisplay.value = "";
        categoryDisplay.value = "";
        eligibility = { ok: false, age: null, category: "" };
        hideBox(notice);
        hideBox(hint);
      }, 0);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideBox(notice);
      await checkNric();
      if (!eligibility.ok) {
        showBox(notice, "报名资格不符合，无法提交。", "bad");
        return;
      }
      const formData = new FormData(form);
      const payload = {
        chinese_name: formData.get("chinese_name"),
        english_name: formData.get("english_name"),
        username: formData.get("username"),
        nric: formData.get("nric"),
        address: formData.get("address"),
        gender: formData.get("gender"),
        phone: formData.get("phone"),
        emergency_contact_name: formData.get("emergency_contact_name"),
        emergency_contact_phone: formData.get("emergency_contact_phone"),
        emergency_contact_relation: formData.get("emergency_contact_relation"),
      };
      try {
        const res = await fetch("/api/form/youth-class-registration/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || data.status !== "success") throw new Error(data.message || "提交失败，请稍后再试");
        form.reset();
        if (data.payment_required && data.payment_url) {
          showBox(notice, "报名成功，3 秒后将前往付款页。", "ok");
          setTimeout(() => {
            window.location.href = data.payment_url;
          }, 3000);
          return;
        }
        showBox(notice, "报名成功，3 秒后将返回主页。", "ok");
        setTimeout(() => {
          window.location.href = "/#/";
        }, 3000);
      } catch (error) {
        showBox(notice, error instanceof Error ? error.message : "提交失败，请稍后再试", "bad");
      }
    });
  </script>
</body>
</html>
