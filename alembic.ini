# 项目根目录的 alembic.ini：让裸 `alembic upgrade head` 直接可用。
# 实际配置仍在 migrations/（Flask-Migrate 布局），`flask db` 命令不受影响。

[alembic]
script_location = migrations
# 裸 alembic 不会把项目根目录加进 sys.path，env.py 里 `from app import create_app` 需要这行。
prepend_sys_path = .

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
