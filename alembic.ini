# 仓库根的 alembic.ini：让裸 `alembic upgrade head` 在根目录直接可用。
# 迁移脚本在 backend/migrations/，env.py 直接读 backend.core.config + backend.models，
# 不经过 Flask（Flask-Migrate 已下线）。

[alembic]
script_location = backend/migrations
# 裸 alembic 不会把 cwd 加进 sys.path，env.py 里 `from backend.core...` 需要这行。
prepend_sys_path = .

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
