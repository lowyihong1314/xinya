<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地南佛学会</title>
    <!-- ⚠️ 首页有两份：**网页版是这一份**（Flask 的 "/" 路由用 send_from_directory 直接发），
         frontend/index.html 只给 APK 用。<head> 里的资源路径两处都要改，
         只改一份的表现是「另一端白屏」，而且另一端你当时多半没在看。

         这里的 <link rel=icon> 和下面的入口 <script> 都改成运行时拼：
         · 为什么不能再写死 "/favicon.ico" / "/static/vite/init.js"：
           多项目共域名之后本项目住在 https://host/UTBA_DEMO/ 下，绝对路径会指到域名根，
           打到别的项目或 404。
         · 为什么不在构建期替换：这份文件既不过 Jinja（不是 render_template），
           也不在 Vite 的入口表里（入口是 main.tsx 那八个），没有任何注入渠道。
         · 为什么 location.pathname 就是前缀：这份首页**只**在应用根路由发出，
           SPA 用的是 HashRouter，路由全在 # 后面（/UTBA_DEMO/#/event/12），
           所以 pathname 恒等于项目前缀，去掉尾斜杠即可。
         · 前缀为空（本地开发、不起 nginx）时 pathname 是 "/" → 去尾斜杠 → ""，
           拼出来还是 /favicon.ico 和 /static/vite/init.js，与改动前逐字节一致。 -->
    <style>
      /* iOS Safari 的 text autosizing：会按区块宽度自作主张放大块内文字。
         聚焦输入框触发缩放后算法重跑，flex-wrap 的容器一换行就变高，
         高度一变又触发下一轮 —— 表现是「每点一次搜索框工具栏就大一圈」。
         designTokens 里也写了一份，但那要等 React 挂载才注入，首屏这一下得靠这里。 */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 放在 body 末尾而不是 <head>：动态插进去的 <script type="module"> 是 async 语义，
      // 搁在 head 里可能赶在 <div id="root"> 解析出来之前就执行，React 会挂不上。
      (function () {
        var base = window.location.pathname.replace(/\/+$/, "");

        function addIcon(rel) {
          var link = document.createElement("link");
          link.rel = rel;
          link.href = base + "/favicon.ico";
          document.head.appendChild(link);
        }
        addIcon("icon");
        addIcon("apple-touch-icon");

        // init.js 内部再去加载的那些 chunk，地址由 vite.config.js 的 base
        // （`${BASE_PATH}/static/vite/`）在构建期写死 —— 那条路和这里是两套机制，
        // 两边算出来的前缀必须是同一个值。
        var entry = document.createElement("script");
        entry.type = "module";
        entry.src = base + "/static/vite/init.js";
        document.head.appendChild(entry);
      })();
    </script>
  </body>
</html>
