<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地南佛学会</title>
    <!-- ⚠️ 首页有两份：**这一份只给 APK**（Capacitor 打包 apk_dist/index.html，
         同时也是 dev server 的文档），网页版是 static/index.html。
         <head> 里的资源路径两处都要改，只改一份就是另一端白屏。

         这里用相对路径：APK 的 vite base 是 "./"，产物跑在 capacitor://localhost 上，
         写死 "/favicon.ico" 指的是 APK 包的根而不是这份产物所在目录；
         项目前缀（BASE_PATH）对 APK 只作用在**请求后端**的地址上，
         那条路走 src/js/basePath.ts，与这里的静态资源无关。
         dev 时文档在 "/"，"./favicon.ico" 解析结果仍是 /favicon.ico，与改动前一致。 -->
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.ico" />
    <style>
      /* 也写在这里一份：designTokens 的样式要等 React 挂载才注入，
         首屏那一下 iOS Safari 已经可能把文字膨胀过一轮了。 */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
