<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：配合 CSS 里的 env(safe-area-inset-*)，
         内容能铺到刘海屏边缘而又不被状态栏/底部横条盖住 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>心芽 · UTBA</title>

    <!-- 相对路径：APK 的 vite base 是 "./"，产物跑在 capacitor://localhost 上，
         写死 "/favicon.ico" 指的是 APK 包的根而不是产物所在目录。
         网页版 base 是 {前缀}/static/vite/，vite 会在构建时把它改写成带前缀的绝对路径。 -->
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.ico" />

    <style>
      /* 必须内联：等 CSS 分块下载完，iOS Safari 已经把文字膨胀过一轮了，
         首屏会看到字忽大忽小。 */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
