apply plugin: 'com.android.application'

def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file('signing.properties')
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { stream ->
        localSigningProperties.load(stream)
    }
}

def signingValue = { propName, envName ->
    def localValue = localSigningProperties.getProperty(propName)
    if (localValue != null && !localValue.toString().trim().isEmpty()) {
        return localValue.toString()
    }
    def projectValue = project.findProperty(propName)?.toString()
    if (projectValue != null && !projectValue.trim().isEmpty()) {
        return projectValue
    }
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return null
}

def releaseStoreFile = signingValue('xinyaReleaseStoreFile', 'XINYA_RELEASE_STORE_FILE') ?: 'utba-release.keystore'
def releaseStorePassword = signingValue('xinyaReleaseStorePassword', 'XINYA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingValue('xinyaReleaseKeyAlias', 'XINYA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingValue('xinyaReleaseKeyPassword', 'XINYA_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def requestedReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains('release')
}
if (requestedReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is not configured. Copy signing.properties.example to signing.properties, ' +
        'or set XINYA_RELEASE_STORE_PASSWORD, XINYA_RELEASE_KEY_ALIAS, and XINYA_RELEASE_KEY_PASSWORD.'
    )
}

def versionCodeProp = project.findProperty('appVersionCode')?.toString()
def versionNameProp = project.findProperty('appVersionName')?.toString()
def resolvedVersionCode = versionCodeProp ? versionCodeProp.toInteger() : 1
def resolvedVersionName = versionNameProp ?: "1.0"

android {
    namespace "com.xinya.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xinya.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.camera:camera-camera2:$androidxCameraVersion"
    implementation "androidx.camera:camera-lifecycle:$androidxCameraVersion"
    implementation "androidx.camera:camera-view:$androidxCameraVersion"
    implementation "androidx.camera:camera-video:$androidxCameraVersion"
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'androidx.media:media:1.7.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
